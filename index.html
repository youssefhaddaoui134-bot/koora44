<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ملعب | مواعيد المباريات وتصميم المنشورات</title>

<!-- خط عربي احترافي -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
rel="stylesheet">

<!-- مكتبة تحويل التصميم إلى صورة -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


<style>

:root{

    --pitch:#0c3d2e;
    --pitch-line:#1f6b4d;

    --night:#07110d;

    --panel:#0e1c17;

    --gold:#f0b429;
    --gold-deep:#c9871a;

    --paper:#f7f3e8;

    --ink:#0c1210;

    --muted:#7fa696;

    --live:#e0452f;

    --teal:#1a7a72;

}


*{

    box-sizing:border-box;

}


body{

    margin:0;

    font-family:
    'Cairo',
    'Tahoma',
    'Segoe UI',
    sans-serif;

    background:
    radial-gradient(
        circle at 50% -10%,
        #123d2c 0%,
        var(--night) 55%
    );

    color:var(--paper);

    min-height:100vh;

    padding-bottom:150px;

}


/* ======================================================
   HEADER
====================================================== */

.stadium-header{

    position:relative;

    padding:22px 16px 20px;

    background:
    linear-gradient(
        180deg,
        var(--pitch) 0%,
        #0a2e22 100%
    );

    overflow:hidden;

    border-bottom:
    3px solid var(--gold);

}


.brand{

    position:relative;

    display:flex;

    align-items:baseline;

    gap:8px;

    justify-content:center;

    margin-bottom:18px;

}


.brand .name{

    font-size:28px;

    font-weight:900;

    letter-spacing:1px;

    color:var(--gold);

}


.brand .tag{

    font-size:12px;

    color:var(--muted);

}


.tabs{

    position:relative;

    display:flex;

    gap:8px;

    justify-content:center;

    flex-wrap:wrap;

}


.tab{

    padding:9px 18px;

    border-radius:999px;

    border:
    1.5px solid var(--pitch-line);

    background:
    rgba(255,255,255,0.04);

    color:var(--paper);

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:
    transform .15s ease,
    background .2s ease,
    color .2s ease;

    white-space:nowrap;

}


.tab.active{

    background:var(--gold);

    color:var(--ink);

    border-color:var(--gold);

}


.tab:active{

    transform:scale(.96);

}



/* ======================================================
   BOTTOM TOOLBAR
====================================================== */

.bottom-bar{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    z-index:100;

    background:
    linear-gradient(
        180deg,
        #0a2e22 0%,
        var(--night) 100%
    );

    border-top:
    3px solid var(--gold);

    box-shadow:
    0 -6px 18px
    rgba(0,0,0,0.45);

    padding-bottom:
    env(safe-area-inset-bottom,0);

}


.action-bar{

    display:flex;

    gap:10px;

    justify-content:center;

    flex-wrap:wrap;

    padding:
    12px 16px 6px;

}


.action-btn{

    padding:
    10px 20px;

    border-radius:10px;

    border:none;

    font-family:'Cairo',sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    transition:
    transform .12s ease,
    filter .15s ease;

}


.action-btn:active{

    transform:scale(.95);

}


.btn-select{

    background:var(--live);

    color:#fff;

}


.btn-design{

    background:#1c3d8f;

    color:#fff;

}


.btn-download{

    background:#0fae6b;

    color:#fff;

}


.action-btn.on{

    filter:brightness(1.25);

    box-shadow:
    0 0 0 2px
    rgba(255,255,255,0.4)
    inset;

}


.hint{

    text-align:center;

    font-size:11px;

    color:var(--muted);

    padding:
    0 16px 8px;

    margin:0;

}



/* ======================================================
   PAGE
====================================================== */

.page{

    display:none;

}


.page.active{

    display:block;

}


.content{

    padding:16px;

    max-width:640px;

    margin:0 auto;

}



/* ======================================================
   DESIGN PAGE
====================================================== */

.design-page-head{

    display:flex;

    align-items:center;

    gap:12px;

    padding:
    18px 16px 6px;

    max-width:640px;

    margin:0 auto;

}


.back-btn{

    background:var(--panel);

    border:
    1.5px solid var(--pitch-line);

    color:var(--paper);

    border-radius:10px;

    padding:
    8px 14px;

    font-family:'Cairo',sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

}


.design-page-head h2{

    font-size:17px;

    color:var(--gold);

    margin:0;

}


.design-chooser{

    display:none;

    gap:8px;

    justify-content:center;

    padding:
    10px 16px;

    flex-wrap:wrap;

}


.design-chooser.show{

    display:flex;

}


.design-chip{

    padding:
    8px 22px;

    border-radius:8px;

    background:var(--panel);

    border:
    1.5px solid var(--gold-deep);

    color:var(--gold);

    font-size:14px;

    font-weight:800;

    cursor:pointer;

}


.design-chip.active{

    background:var(--gold);

    color:var(--ink);

}



/* ======================================================
   DATE RAIL
====================================================== */

.date-rail{

    display:flex;

    gap:8px;

    overflow-x:auto;

    padding:
    14px 16px 4px;

    -webkit-overflow-scrolling:touch;

}


.date-rail::-webkit-scrollbar{

    display:none;

}


.date-pill{

    flex:
    0 0 auto;

    padding:
    8px 16px;

    border-radius:10px;

    background:var(--panel);

    border:
    1px solid
    rgba(255,255,255,0.08);

    font-size:13px;

    font-weight:700;

    color:var(--muted);

    cursor:pointer;

    text-align:center;

    line-height:1.5;

}


.date-pill .dow{

    display:block;

}


.date-pill .dnum{

    display:block;

    font-size:11px;

    opacity:.8;

}


.date-pill.active{

    background:var(--gold);

    color:var(--ink);

    border-color:var(--gold);

}



/* ======================================================
   LEAGUE TITLE
====================================================== */

.section-title{

    display:flex;

    align-items:center;

    gap:10px;

    margin:
    22px 0 10px;

    font-family:'Cairo',sans-serif;

    font-size:16px;

    font-weight:900;

    color:var(--gold);

}


.section-title::after{

    content:"";

    flex:1;

    height:1px;

    background:
    linear-gradient(
        90deg,
        rgba(240,180,41,0.5),
        transparent
    );

}


.section-title .badge{

    background:var(--gold);

    color:var(--ink);

    font-size:10px;

    font-weight:700;

    padding:
    3px 8px;

    border-radius:6px;

    white-space:nowrap;

}


.section-title img.league-logo{

    width:22px;

    height:22px;

    object-fit:contain;

}



/* ======================================================
   STATUS MESSAGE
====================================================== */

.state-msg{

    text-align:center;

    color:var(--muted);

    font-size:14px;

    padding:
    40px 10px;

}


.state-msg.error{

    color:var(--live);

}



/* ======================================================
   MATCH CARD
====================================================== */

.match-card{

    display:flex;

    align-items:center;

    background:var(--paper);

    color:var(--ink);

    border-radius:12px;

    padding:
    11px 12px;

    margin-bottom:10px;

    box-shadow:
    0 3px 0
    rgba(0,0,0,0.25);

    gap:8px;

    position:relative;

}


.match-card.selectable{

    padding-left:44px;

}


.match-check{

    display:none;

    position:absolute;

    left:10px;

    top:50%;

    transform:
    translateY(-50%);

    width:22px;

    height:22px;

    border-radius:6px;

    border:
    2px solid var(--pitch);

    background:#fff;

    align-items:center;

    justify-content:center;

    font-size:14px;

    font-weight:900;

    color:var(--pitch);

    cursor:pointer;

}


.selectable .match-check{

    display:flex;

}


.match-card.picked{

    outline:
    3px solid var(--gold);

}


.match-card.picked .match-check{

    background:var(--pitch);

    color:#fff;

}



/* ======================================================
   TEAM LOGO
====================================================== */

.crest{

    width:38px;

    height:38px;

    flex:
    0 0 auto;

    object-fit:contain;

}



/* ======================================================
   TEAM NAME
====================================================== */

.team-name{

    flex:1;

    min-width:0;

    font-family:
    'Cairo',
    sans-serif;

    font-size:14px;

    font-weight:800;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}


.team-name.home{

    text-align:right;

}


.team-name.away{

    text-align:left;

}



/* ======================================================
   MATCH TIME
====================================================== */

.kickoff{

    flex:
    0 0 auto;

    min-width:64px;

    text-align:center;

    background:var(--gold);

    color:var(--ink);

    font-weight:900;

    font-size:14px;

    padding:
    7px 10px;

    border-radius:8px;

}


.kickoff.live{

    background:var(--live);

    color:#fff;

}


.kickoff.finished{

    background:var(--muted);

    color:var(--ink);

}


.kickoff .score{

    font-size:15px;

}


.kickoff .min{

    font-size:10px;

    display:block;

    font-weight:700;

}



/* ======================================================
   POSTER PREVIEW
====================================================== */

.preview-shell{

    margin-top:26px;

}


.preview-shell h3{

    font-size:14px;

    color:var(--muted);

    font-weight:700;

    margin:
    0 0 10px;

    text-align:center;

}


#posterPreview{

    background:#000;

    border:
    3px solid var(--gold);

    border-radius:16px;

    padding:
    22px 16px;

    min-height:120px;

}


.poster-empty{

    text-align:center;

    color:var(--muted);

    font-size:13px;

    padding:
    30px 10px;

}



/* ======================================================
   DESIGN 1
====================================================== */

.poster-d1-title{

    background:var(--gold);

    color:var(--ink);

    font-weight:900;

    font-size:18px;

    text-align:center;

    padding:12px;

    border-radius:10px;

    margin-bottom:16px;

}


.poster-d1-row{

    display:flex;

    align-items:center;

    background:var(--paper);

    color:var(--ink);

    border-radius:12px;

    padding:
    10px 12px;

    margin-bottom:10px;

    gap:8px;

}



/* ======================================================
   DESIGN 2
====================================================== */

.poster-d2{

    text-align:center;

    padding:
    18px 8px;

    border-bottom:
    1px solid
    rgba(255,255,255,0.08);

    margin-bottom:12px;

}


.poster-d2:last-child{

    border-bottom:none;

    margin-bottom:0;

}


.poster-d2 .comp-name{

    font-size:16px;

    color:var(--paper);

    font-weight:800;

    margin-bottom:14px;

}


.poster-d2 .teams-row{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:28px;

}


.poster-d2 .crest-big{

    width:74px;

    height:74px;

    object-fit:contain;

}


.poster-d2 .time-big{

    font-size:26px;

    font-weight:900;

    color:var(--gold);

}


.poster-d2 .names-row{

    display:flex;

    justify-content:space-around;

    gap:20px;

    margin-top:12px;

    font-weight:800;

    font-size:14px;

}


.poster-d2 .date-pill2{

    display:inline-block;

    margin-top:14px;

    background:var(--pitch);

    color:#fff;

    padding:
    6px 18px;

    border-radius:8px;

    font-size:13px;

    font-weight:700;

}



/* ======================================================
   DESIGN 3
====================================================== */

.poster-d3-heading{

    text-align:center;

    color:var(--gold);

    font-weight:900;

    font-size:17px;

    margin:
    0 0 12px;

    padding-bottom:8px;

    border-bottom:
    2px solid var(--gold-deep);

}


.poster-d3-heading:not(:first-child){

    margin-top:22px;

}


.poster-d3{

    display:flex;

    align-items:center;

    gap:8px;

    background:
    linear-gradient(
        90deg,
        var(--teal),
        #0e2e2b
    );

    border-radius:14px;

    padding:
    14px 12px;

    margin-bottom:12px;

    border:
    1px dashed
    rgba(255,255,255,0.3);

}


.poster-d3 .team-name{

    color:#fff;

}


.poster-d3 .kickoff{

    background:var(--gold);

}



/* ======================================================
   FOOTER
====================================================== */

footer{

    text-align:center;

    color:var(--muted);

    font-size:11px;

    margin-top:30px;

}



/* ======================================================
   MOBILE
====================================================== */

@media(max-width:500px){

    .brand{

        flex-direction:column;

        align-items:center;

        gap:2px;

    }

    .brand .tag{

        text-align:center;

    }

    .team-name{

        font-size:12px;

    }

    .crest{

        width:34px;

        height:34px;

    }

    .kickoff{

        min-width:58px;

        font-size:12px;

        padding:6px;

    }

}

</style>

</head>


<body>

        </div>

<!-- ======================================================
     MAIN PAGE
====================================================== -->

<div
class="content page active"
id="mainView">


    <!-- التاريخ -->

    <div
    class="date-rail"
    id="dateRail">
    </div>



    <!-- المباريات -->

    <div id="matchesContainer">

        <div class="state-msg">

            جارٍ تحميل المباريات...

        </div>

    </div>


</div>



<!-- ======================================================
     DESIGN PAGE
====================================================== -->

<div
class="page"
id="designPage">


    <div class="design-page-head">

        <button
        class="back-btn"
        id="backBtn">

            → رجوع

        </button>


        <h2>

            اختر تصميم المنشور

        </h2>

    </div>



    <!-- اختيار التصميم -->

    <div
    class="design-chooser show"
    id="designChooser">


        <div
        class="design-chip active"
        data-design="1">

            التصميم 1

        </div>


        <div
        class="design-chip"
        data-design="2">

            التصميم 2

        </div>


        <div
        class="design-chip"
        data-design="3">

            التصميم 3

        </div>


    </div>



    <!-- Preview -->

    <div class="content">

        <div class="preview-shell">

            <h3>

                معاينة المنشور

            </h3>

<footer>

    البيانات من GOAL API

<script>


/* ======================================================
   SETTINGS
====================================================== */

const API_BASE = '';

const ARABIC_DAYS = [

    'الأحد',

    'الاثنين',

    'الثلاثاء',

    'الأربعاء',

    'الخميس',

    'الجمعة',

    'السبت'

];



/* ======================================================
   DATE FUNCTIONS
====================================================== */

function toDateKey(date){

    return date
    .toISOString()
    .slice(0,10);

}



function formatDayLabel(date,todayKey){

    const key =
    toDateKey(date);


    if(key === todayKey){

        return {

            dow:'اليوم',

            dnum:
            date.getDate()

        };

    }


    const yesterdayKey =
    toDateKey(
        new Date(
            Date.now() - 86400000
        )
    );


    const tomorrowKey =
    toDateKey(
        new Date(
            Date.now() + 86400000
        )
    );


    if(key === yesterdayKey){

        return {

            dow:'أمس',

            dnum:
            date.getDate()

        };

    }


    if(key === tomorrowKey){

        return {

            dow:'غداً',

            dnum:
            date.getDate()

        };

    }


    return {

        dow:
        ARABIC_DAYS[
            date.getUTCDay()
        ],

        dnum:
        date.getDate()

    };

}



/* ======================================================
   DATE RAIL
====================================================== */

const rail =
document.getElementById(
    'dateRail'
);


const today =
new Date();


const todayKey =
toDateKey(today);


let selectedDate =
todayKey;



for(

    let offset = -3;

    offset <= 3;

    offset++

){


    const date =
    new Date(
        Date.now()
        +
        offset * 86400000
    );


    const key =
    toDateKey(date);


    const label =
    formatDayLabel(
        date,
        todayKey
    );


    const pill =
    document.createElement(
        'div'
    );


    pill.className =

    'date-pill'

    +

    (

        key === todayKey

        ?

        ' active'

        :

        ''

    );


    pill.dataset.date =
    key;


    pill.innerHTML =

    `

    <span class="dow">

        ${label.dow}

    </span>


    <span class="dnum">

        ${label.dnum}

    </span>

    `;



    pill.addEventListener(

        'click',

        ()=>{


            document
            .querySelectorAll(
                '.date-pill'
            )

            .forEach(

                p=>

                p.classList
                .remove('active')

            );


            pill.classList
            .add('active');


            selectedDate =
            key;


            loadFixtures(
                selectedDate
            );


        }

    );



    rail.appendChild(
        pill
    );


}



/* ======================================================
   MATCHES
====================================================== */

const matchesContainer =
document.getElementById(
    'matchesContainer'
);


let leaguesData = [];



/* ======================================================
   MATCH STATUS
====================================================== */

function statusLabel(match){


    if(
        match.status === 'live'
    ){


        const min =

        match.elapsed != null

        ?

        `${match.elapsed}'`

        :

        'مباشر';



        return {

            text:min,

            cls:'live',

            score:

            `${

                match.goals.home ?? 0

            }-${

                match.goals.away ?? 0

            }`

        };


    }



    if(
        match.status === 'finished'
    ){


        return {

            text:null,

            cls:'finished',

            score:

            `${

                match.goals.home ?? 0

            }-${

                match.goals.away ?? 0

            }`

        };


    }



    const time =
    new Intl.DateTimeFormat(
        'en-GB',
        {
            timeZone:'Africa/Casablanca',
            hour:'2-digit',
            minute:'2-digit',
            hourCycle:'h23'
        }
    ).format(
        new Date(
            match.date
        )
    );



    return {

        text:

        time,

        cls:
        'scheduled',

        score:
        null

    };


}



/* ======================================================
   RENDER MATCHES
====================================================== */

function renderMatches(leagues){


    leaguesData =
    leagues;


    if(

        !leagues

        ||

        leagues.length === 0

    ){


        matchesContainer.innerHTML =

        `

        <div class="state-msg">

            لا توجد مباريات في هذا اليوم

        </div>

        `;


        return;

    }



    let html = '';



    leagues.forEach(league=>{


        /* البطولة */

        html += `

        <div class="section-title">


            <img

            class="league-logo"

            src="${league.leagueLogo}"

            alt="${league.leagueName}"

            >


            <span class="badge">

                ${league.country || 'دولي'}

            </span>


            ${league.leagueName}


        </div>

        `;



        /* المباريات */

        league.matches.forEach(m=>{


            const homeTeam =
            m.homeTeam || m.home || {};


            const awayTeam =
            m.awayTeam || m.away || {};


            const st =
            statusLabel(m);



            html += `


            <div

            class="match-card"


            data-id="${m.id}"


            data-comp="${league.leagueName}"


            data-time="${
                st.score
                ?
                st.score
                :
                st.text
            }"


            data-hname="${homeTeam.name}"


            data-hlogo="${homeTeam.logo || ''}"


            data-aname="${awayTeam.name}"


            data-alogo="${awayTeam.logo || ''}"

            >


                <div class="match-check">

                    ✓

                </div>



                <!-- HOME LOGO -->

                <img

                class="crest"

                src="${homeTeam.logo || ''}"

                alt="${homeTeam.name}"

                onerror="this.remove()"

                >



                <!-- HOME NAME -->

                <span class="team-name home">

                    ${homeTeam.name}

                </span>



                <!-- TIME -->

                <div

                class="kickoff ${st.cls}"

                >


                    ${

                        st.score

                        ?

                        `<span class="score">

                            ${st.score}

                        </span>`

                        :

                        ''

                    }



                    ${

                        st.text

                        &&

                        st.cls === 'live'

                        ?

                        `<span class="min">

                            ${st.text}

                        </span>`

                        :

                        (

                            !st.score

                            ?

                            st.text

                            :

                            ''

                        )

                    }


                </div>



                <!-- AWAY NAME -->

                <span class="team-name away">

                    ${awayTeam.name}

                </span>



                <!-- AWAY LOGO -->

                <img

                class="crest"

                src="${awayTeam.logo || ''}"

                alt="${awayTeam.name}"

                onerror="this.remove()"

                >


            </div>


            `;


        });


    });



    matchesContainer.innerHTML =
    html;


    attachCardHandlers();


}



/* ======================================================
   LOAD FIXTURES
====================================================== */

function mapGoalApiResponse(data){

    if(
        Array.isArray(data?.leagues)
    ){

        return data.leagues;

    }


    const events =
    Array.isArray(data)
        ? data
        : data?.events
            || data?.scheduledEvents
            || data?.response
            || data?.fixtures
            || data?.data?.fixtures
            || (Array.isArray(data?.data) ? data.data : [])
            || [];


    const leagues = {};


    events.forEach(event=>{

        const homeTeam =
        event.homeTeam || event.home_team || {};


        const awayTeam =
        event.awayTeam || event.away_team || {};


        const tournament =
        event.tournament || event.league || {};


        const uniqueTournament =
        tournament.uniqueTournament || {};


        const leagueId =
        uniqueTournament.id
        || tournament.id
        || 'unknown';


        const leagueName =
        uniqueTournament.name
        || tournament.name
        || 'بطولة غير معروفة';


        const timestamp =
        event.startTimestamp
        || (event.kickoffUtc
            ? Math.floor(Date.parse(event.kickoffUtc) / 1000)
            : 0)
        || (event.startTime
            ? Math.floor(Date.parse(event.startTime) / 1000)
            : 0);


        if(!leagues[leagueId]){

            leagues[leagueId] = {

                leagueId,
                leagueName,
                country:
                tournament.category?.name
                || event.category?.name
                || 'دولي',
                leagueLogo:
                uniqueTournament.logo
                || tournament.logo
                || '',
                matches: []

            };

        }


        leagues[leagueId].matches.push({

            id: event.id,
            date: event.startTime
                || (timestamp
                    ? new Date(timestamp * 1000).toISOString()
                    : null),
            timestamp,
            venue: event.venue?.name || '',
            status: event.status?.type === 'inprogress'
                ? 'live'
                : event.status?.type === 'finished'
                    ? 'finished'
                    : event.status?.type === 'canceled'
                        || event.status?.type === 'postponed'
                        ? 'postponed'
                        : 'scheduled',
            home: {
                id: event.homeTeamId || homeTeam.id,
                name: event.homeTeamName || homeTeam.name || 'الفريق الأول',
                logo: homeTeam.badge || event.teamHomeBadge || homeTeam.logo || '',
                winner: null
            },
            away: {
                id: event.awayTeamId || awayTeam.id,
                name: event.awayTeamName || awayTeam.name || 'الفريق الثاني',
                logo: awayTeam.badge || event.teamAwayBadge || awayTeam.logo || '',
                winner: null
            },
            goals: {
                home: event.homeTeamScore ?? event.homeScore?.current,
                away: event.awayTeamScore ?? event.awayScore?.current
            }

        });

    });


    return Object.values(leagues);

}

async function loadFixtures(dateKey){


    matchesContainer.innerHTML =

    `

    <div class="state-msg">

        جارٍ تحميل المباريات...

    </div>

    `;



    try{


        const response =

        await fetch(

            `${API_BASE}/api/fixtures?date=${dateKey}`

        );



        if(
            !response.ok
        ){


            const error =

            await response
            .json()

            .catch(
                ()=>({})
            );



            throw new Error(

                error.error

                ||

                'تعذر تحميل المباريات'

            );


        }



        const data =

        await response.json();



        renderMatches(
            mapGoalApiResponse(data)
        );


    }


    catch(error){


        console.error(
            error
        );


        matchesContainer.innerHTML =

        `

        <div class="state-msg error">

            ${error.message}

        </div>

        `;


    }


}



/* ======================================================
   LOAD TODAY
====================================================== */

loadFixtures(
    selectedDate
);



/* ======================================================
   SELECT MODE
====================================================== */

let selectMode =
false;


const selectedIds =
new Set();


const selectBtn =
document.getElementById(
    'selectBtn'
);


const hint =
document.getElementById(
    'hint'
);



selectBtn.addEventListener(

    'click',

    ()=>{


        selectMode =
        !selectMode;



        selectBtn
        .classList
        .toggle(
            'on',
            selectMode
        );



        selectBtn.textContent =

        selectMode

        ?

        'إنهاء التحديد'

        :

        'تحديد';



        document
        .querySelectorAll(
            '.match-card'
        )

        .forEach(

            card=>

            card.classList
            .toggle(
                'selectable',
                selectMode
            )

        );



        hint.textContent =

        selectMode

        ?

        'اضغط على المباريات لتحديدها'

        :

        'اضغط "تحديد" لاختيار المباريات، ثم "تحديد التصميم" لصياغتها، ثم "تنزيل" لحفظها كصورة';


    }

);



/* ======================================================
   CARD HANDLERS
====================================================== */

function attachCardHandlers(){


    document
    .querySelectorAll(
        '.match-card'
    )

    .forEach(card=>{


        card.classList
        .toggle(
            'selectable',
            selectMode
        );



        const id =
        card.dataset.id;



        if(
            selectedIds.has(id)
        ){

            card.classList
            .add('picked');

        }



        card.addEventListener(

            'click',

            ()=>{


                if(
                    !selectMode
                ){

                    return;

                }



                if(
                    selectedIds.has(id)
                ){


                    selectedIds.delete(id);


                    card.classList
                    .remove('picked');


                }


                else{


                    selectedIds.add(id);


                    card.classList
                    .add('picked');


                }



            }

        );


    });


}



/* ======================================================
   DESIGN PAGE
====================================================== */

const designBtn =
document.getElementById(
    'designBtn'
);


const backBtn =
document.getElementById(
    'backBtn'
);


const mainView =
document.getElementById(
    'mainView'
);


const designPage =
document.getElementById(
    'designPage'
);


let currentDesign =
'1';



designBtn.addEventListener(

    'click',

    ()=>{


        if(
            selectedIds.size === 0
        ){


            hint.textContent =

            'حدد مباراة واحدة على الأقل أولاً';


            return;

        }



        mainView.classList
        .remove('active');


        designPage.classList
        .add('active');



        renderPoster(
            currentDesign
        );



        window.scrollTo(
            0,
            0
        );


    }

);



backBtn.addEventListener(

    'click',

    ()=>{


        designPage.classList
        .remove('active');


        mainView.classList
        .add('active');


    }

);



document
.querySelectorAll(
    '.design-chip'
)

.forEach(chip=>{


    chip.addEventListener(

        'click',

        ()=>{


            document
            .querySelectorAll(
                '.design-chip'
            )

            .forEach(

                item=>

                item.classList
                .remove('active')

            );



            chip.classList
            .add('active');



            currentDesign =
            chip.dataset.design;



            renderPoster(
                currentDesign
            );


        }

    );


});



/* ======================================================
   GET SELECTED MATCHES
====================================================== */

function getSelectedMatches(){


    return Array
    .from(selectedIds)

    .map(id=>{


        const card =

        document.querySelector(

            `.match-card[data-id="${id}"]`

        );



        if(
            !card
        ){

            return null;

        }



        return {


            comp:

            card.dataset.comp,


            time:

            card.dataset.time,


            hname:

            card.dataset.hname,


            hlogo:

            card.dataset.hlogo,


            aname:

            card.dataset.aname,


            alogo:

            card.dataset.alogo


        };


    })


    .filter(Boolean);


}



/* ======================================================
   RENDER POSTER
====================================================== */

function renderPoster(design){


    const preview =

    document.getElementById(
        'posterPreview'
    );


    const matches =

    getSelectedMatches();



    if(
        matches.length === 0
    ){


        preview.innerHTML =

        `

        <div class="poster-empty">

            لم يتم اختيار أي مباراة بعد

        </div>

        `;


        return;

    }



    /* ======================
       DESIGN 1
    ====================== */

    if(
        design === '1'
    ){


        let html =

        `

        <div class="poster-d1-title">

            مواعيد المباريات

        </div>

        `;



        matches.forEach(m=>{


            html +=

            `

            <div class="poster-d1-row">


                <img

                class="crest"

                src="${m.hlogo}"

                crossorigin="anonymous"

                onerror="this.remove()"

                >



                <span class="team-name home">

                    ${m.hname}

                </span>



                <div class="kickoff">

                    ${m.time}

                </div>



                <span class="team-name away">

                    ${m.aname}

                </span>



                <img

                class="crest"

                src="${m.alogo}"

                crossorigin="anonymous"

                onerror="this.remove()"

                >


            </div>

            `;


        });



        preview.innerHTML =
        html;


    }



    /* ======================
       DESIGN 2
    ====================== */

    else if(
        design === '2'
    ){


        let html = '';



        matches.forEach(m=>{


            html +=

            `

            <div class="poster-d2">


                <div class="comp-name">

                    ${m.comp}

                </div>



                <div class="teams-row">


                    <img

                    class="crest-big"

                    src="${m.hlogo}"

                    crossorigin="anonymous"

                    >



                    <div class="time-big">

                        ${m.time}

                    </div>



                    <img

                    class="crest-big"

                    src="${m.alogo}"

                    crossorigin="anonymous"

                    >


                </div>



                <div class="names-row">


                    <span>

                        ${m.hname}

                    </span>


                    <span>

                        ${m.aname}

                    </span>


                </div>



                <div class="date-pill2">


                    ${

                        selectedDate === todayKey

                        ?

                        'اليوم'

                        :

                        selectedDate

                    }


                </div>


            </div>

            `;


        });



        preview.innerHTML =
        html;


    }



    /* ======================
       DESIGN 3
    ====================== */

    else if(
        design === '3'
    ){


        let html = '';

        let lastComp = null;



        matches.forEach(m=>{


            if(
                m.comp !== lastComp
            ){


                html +=

                `

                <div class="poster-d3-heading">

                    ${m.comp}

                </div>

                `;



                lastComp =
                m.comp;


            }



            html +=

            `

            <div class="poster-d3">


                <img

                class="crest"

                src="${m.hlogo}"

                crossorigin="anonymous"

                onerror="this.remove()"

                >



                <span class="team-name home">

                    ${m.hname}

                </span>



                <div class="kickoff">

                    ${m.time}

                </div>



                <span class="team-name away">

                    ${m.aname}

                </span>



                <img

                class="crest"

                src="${m.alogo}"

                crossorigin="anonymous"

                onerror="this.remove()"

                >


            </div>

            `;


        });



        preview.innerHTML =
        html;


    }


}



/* ======================================================
   DOWNLOAD IMAGE
====================================================== */

document
.getElementById(
    'downloadBtn'
)

.addEventListener(

    'click',

    ()=>{


        const target =

        document.getElementById(
            'posterPreview'
        );



        if(
            selectedIds.size === 0
        ){


            hint.textContent =

            'لا يوجد شيء لتنزيله — حدد مباريات واختر تصميماً أولاً';


            return;

        }



        html2canvas(

            target,

            {

                backgroundColor:

                '#000000',


                scale:

                2,


                useCORS:

                true

            }

        )

        .then(canvas=>{


            const link =

            document.createElement(
                'a'
            );



            link.download =

            'مواعيد-المباريات.png';



            link.href =

            canvas.toDataURL(
                'image/png'
            );



            link.click();


        });


    }

);
